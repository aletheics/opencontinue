name: Checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCONTINUE_API_KEY: ${{ secrets.OPENCONTINUE_API_KEY }}
      OPENCONTINUE_BASE_URL: ${{ secrets.OPENCONTINUE_BASE_URL }}
      OPENCONTINUE_MODEL: ${{ secrets.OPENCONTINUE_MODEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Provider not configured
        if: ${{ env.OPENCONTINUE_API_KEY == '' }}
        run: echo "::notice::OPENCONTINUE_API_KEY is not set; skipping AI checks."
      - name: Run OpenContinue checks
        if: ${{ env.OPENCONTINUE_API_KEY != '' }}
        uses: ./actions/check
        with:
          base: origin/${{ github.base_ref }}
          api-key: ${{ secrets.OPENCONTINUE_API_KEY }}
          base-url: ${{ secrets.OPENCONTINUE_BASE_URL }}
          model: ${{ secrets.OPENCONTINUE_MODEL }}
